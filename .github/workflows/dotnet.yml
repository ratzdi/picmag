# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  unit-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal

  integration-tests:

    needs: unit-tests

    runs-on: ubuntu-latest

    env:
      TZ: Europe/Berlin

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install integration test dependencies
      run: sudo apt-get update && sudo apt-get install -y sqlite3 ffmpeg
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run integration tests
      run: chmod +x ./integration_test.sh && ./integration_test.sh
      working-directory: picmag/tests

  build-deb:

    needs: integration-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm, linux-arm64]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install dotnet-deb
      run: dotnet tool install --global dotnet-deb
    - name: Build Debian package (${{ matrix.runtime }})
      run: dotnet deb -r ${{ matrix.runtime }}
      working-directory: picmag
    - name: Upload Debian package artifact (${{ matrix.runtime }})
      uses: actions/upload-artifact@v4
      with:
        name: picmag-debian-package-${{ matrix.runtime }}
        path: picmag/**/*.deb
